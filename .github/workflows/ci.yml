# Runs on every push to main and every pull request: lint + unit tests.
# Free: no API key, no database, no model downloads (unit tests mock all of those).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # this workflow only reads the repo

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Exact version: setup-uv publishes no moving "v10" tag. Installs uv, which then
      # installs Python from .python-version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true # reuse downloaded packages between runs

      - name: Install dependencies (exactly as locked)
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Unit tests
        run: uv run pytest -q
