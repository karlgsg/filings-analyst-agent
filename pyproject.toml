[project]
name = "analyst"
version = "0.1.0"
description = "AI agent that answers questions over SEC filings with page-level citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.3.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
line-length = 100
