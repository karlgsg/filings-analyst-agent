[project]
name = "analyst"
version = "0.1.0"
description = "AI agent that answers questions over SEC filings with page-level citations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.10.0",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langfuse>=5.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.2",
    "pymupdf>=2.1",
    "python-dotenv>=1.0",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "torch>=2.15.0",  # pinned to a CPU-only build on Linux, see [tool.uv.sources]
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst"]

[tool.ruff]
line-length = 100

# On Linux (CI, deploy servers) use the CPU-only PyTorch build: the default one pulls
# ~3 GB of NVIDIA GPU libraries we never use. macOS is unaffected.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
